# nginx: HTTPS снаружи -> сервер карты на 127.0.0.1:8787.
# Замените world.example.com на свой домен (A-запись домена должна указывать на IP VPS).
# Установка: sudo cp nginx-idle-heroes.conf /etc/nginx/sites-available/idle-heroes
#            sudo ln -s /etc/nginx/sites-available/idle-heroes /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
#            sudo certbot --nginx -d world.example.com     # выпустит сертификат и включит HTTPS

limit_req_zone $binary_remote_addr zone=idle_api:10m rate=20r/s;

server {
    listen 80;
    server_name world.example.com;

    location /api/ {
        limit_req zone=idle_api burst=40 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
